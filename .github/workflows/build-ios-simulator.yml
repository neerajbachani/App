name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: npm run pod-install

      - name: Patch expo-modules-core Swift concurrency issue
        run: |
          FILE="node_modules/expo-modules-core/ios/Core/Views/SwiftUI/SwiftUIVirtualView.swift"
          echo "=== Before patch ==="
          sed -n '158,162p' "$FILE"
          sed -i '' 's/assert(props\.children?\.count == children\.count - 1/let _cnt = props.children?.count; assert(_cnt == children.count - 1/g' "$FILE"
          echo "=== After patch ==="
          sed -n '158,162p' "$FILE"

      - name: Build iOS Simulator .app
        continue-on-error: true
        run: |
          xcodebuild \
            -workspace ios/NewExpensify.xcworkspace \
            -scheme "New Expensify Dev" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          echo "=== EXIT CODE: ${PIPESTATUS[0]} ==="

      - name: Show real errors
        if: always()
        run: |
          echo "=== REAL COMPILER ERRORS ==="
          grep ": error:" /tmp/xcodebuild.log | grep -v "NSError\|Logger\|stat:\|error:(NSError" | head -30
          echo "=== LAST 10 LINES OF BUILD LOG ==="
          tail -10 /tmp/xcodebuild.log
          echo "=== APP SIZE ==="
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          du -sh "$APP_PATH" 2>/dev/null || echo "App is empty or missing"

      - name: Zip and upload .app
        if: always()
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          ACTUAL_SIZE=$(du -sk "$APP_PATH" | cut -f1)
          echo "App size: ${ACTUAL_SIZE} KB"
          if [ "$ACTUAL_SIZE" -lt 1000 ]; then
            echo "ERROR: App is too small (${ACTUAL_SIZE} KB) - build failed"
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/NewExpensify.zip" "$(basename "$APP_PATH")"
          ls -lh "$GITHUB_WORKSPACE/NewExpensify.zip"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewExpensify-simulator
          path: NewExpensify.zip
          retention-days: 3