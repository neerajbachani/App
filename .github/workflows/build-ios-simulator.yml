name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: npm run pod-install

      - name: Patch ExpoModulesCore Swift version
        run: |
          PODSPEC="ios/Pods/Target Support Files/ExpoModulesCore/ExpoModulesCore.debug.xcconfig"
          echo "=== Patching Swift version for ExpoModulesCore ==="
          # Add Swift 5 language version to override Swift 6 strict concurrency
          echo "SWIFT_VERSION = 5.0" >> "ios/Pods/Target Support Files/ExpoModulesCore/ExpoModulesCore.debug.xcconfig" || true
          echo "SWIFT_STRICT_CONCURRENCY = minimal" >> "ios/Pods/Target Support Files/ExpoModulesCore/ExpoModulesCore.debug.xcconfig" || true
          echo "Done patching"

      - name: Build iOS Simulator .app
        continue-on-error: true
        run: |
          xcodebuild \
            -workspace ios/NewExpensify.xcworkspace \
            -scheme "New Expensify Dev" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build 2>&1 | tee /tmp/xcodebuild.log
          echo "=== EXIT CODE: ${PIPESTATUS[0]} ==="

      - name: Show real errors
        if: always()
        run: |
          echo "=== REAL COMPILER ERRORS ==="
          grep ": error:" /tmp/xcodebuild.log | grep -v "NSError\|Logger\|stat:\|error:(NSError" | head -30
          echo "=== LAST 5 LINES ==="
          tail -5 /tmp/xcodebuild.log
          echo "=== APP SIZE ==="
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          du -sh "$APP_PATH" 2>/dev/null || echo "App is empty or missing"

      - name: Zip and upload .app
        if: always()
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          ACTUAL_SIZE=$(du -sk "$APP_PATH" | cut -f1)
          echo "App size: ${ACTUAL_SIZE} KB"
          if [ "$ACTUAL_SIZE" -lt 1000 ]; then
            echo "ERROR: App too small (${ACTUAL_SIZE} KB)"
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/NewExpensify.zip" "$(basename "$APP_PATH")"
          ls -lh "$GITHUB_WORKSPACE/NewExpensify.zip"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewExpensify-simulator
          path: NewExpensify.zip
          retention-days: 3