name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: npm run pod-install

      - name: Install xcpretty
        run: gem install xcpretty

      - name: List available schemes
        run: xcodebuild -workspace ios/NewExpensify.xcworkspace -list

      - name: Build iOS Simulator .app
        run: |
          xcodebuild \
            -workspace ios/NewExpensify.xcworkspace \
            -scheme NewExpensify \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | xcpretty

      - name: Find built app
        run: find ios/build -name "*.app" -type d

      - name: Zip .app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r NewExpensify.zip *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewExpensify-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/NewExpensify.zip
          retention-days: 3
