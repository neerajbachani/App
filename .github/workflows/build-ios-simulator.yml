name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: npm run pod-install

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build iOS Simulator .app
        continue-on-error: true
        run: |
          xcodebuild \
            -workspace ios/NewExpensify.xcworkspace \
            -scheme "New Expensify Dev" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | xcpretty --color

      - name: Zip .app
        if: always()
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          echo "Zipping: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/NewExpensify.zip" "$(basename "$APP_PATH")"
          echo "Zip created successfully"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewExpensify-simulator
          path: NewExpensify.zip
          retention-days: 3
