name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: npm run pod-install

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build iOS Simulator .app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/NewExpensify.xcworkspace \
            -scheme "New Expensify Dev" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | xcpretty --color
          echo "Exit code: ${PIPESTATUS[0]}"

      - name: Find built app
        if: always()
        run: find ios/build -name "*.app" -type d 2>/dev/null || echo "No .app found"

      - name: Zip .app
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          zip -r NewExpensify.zip "$APP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewExpensify-simulator
          path: NewExpensify.zip
          retention-days: 3
